<div class="pl-shell">
  <header class="pl-topbar">
    <span class="pl-brand">
      <span class="pl-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>
      <span class="pl-brand__name">Posta Médica Valdiviezo</span>
    </span>
    <button type="button" class="pl-toggle" [attr.aria-expanded]="menuAbierto" aria-controls="pl-menu" (click)="alternarMenu()">
      {{ menuAbierto ? 'Cerrar menú' : 'Menú' }}
    </button>
  </header>

  <aside class="pl-sidebar" [class.pl-sidebar--abierto]="menuAbierto">
    <span class="pl-brand pl-brand--lateral">
      <span class="pl-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>
      <span class="pl-brand__name">Posta Médica Valdiviezo</span>
    </span>

    <nav id="pl-menu" class="sidebar-nav pl-nav" aria-label="Menú del paciente">
      <a routerLink="/welcome" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="pl-link" (click)="cerrarMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" /></svg>
        Inicio
      </a>
      <a routerLink="/paciente/registrar-cita" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="pl-link" (click)="cerrarMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M8 3v4M16 3v4M4 10h16M12 13v4M10 15h4" /></svg>
        Registrar cita
      </a>
      <a routerLink="/paciente/mis-citas" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="pl-link" (click)="cerrarMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M8 3v4M16 3v4M4 10h16" /></svg>
        Mis citas
      </a>
      <a routerLink="/paciente/historial-medico" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="pl-link" (click)="cerrarMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z" /><path d="M14 3v5h5M10 13h6M10 17h6" /></svg>
        Historial médico
      </a>
    </nav>

    <button type="button" class="logout-btn pl-logout" (click)="logout()">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9" /></svg>
      Cerrar Sesión
    </button>
  </aside>

  <main class="pl-main">
    <div class="pl-content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
