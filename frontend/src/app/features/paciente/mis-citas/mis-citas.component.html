<app-paciente-layout>
  <header class="ui-page-head">
    <h1 class="ui-page-title">Mis citas</h1>
    <p class="ui-page-sub">Revise el estado de sus citas médicas.</p>
  </header>

  <div *ngIf="citas.length === 0" class="ui-empty">
    <p>No tienes citas registradas.</p>
    <a routerLink="/paciente/registrar-cita" class="ui-btn ui-btn--primary ui-btn--auto">Reservar cita</a>
  </div>

  <div class="mc-grid">
    <article class="ui-card mc-card" *ngFor="let c of citas">
      <div class="mc-card__head">
        <h5 class="mc-card__title">{{ c.fecha_cita }} - {{ c.hora_cita }}</h5>
        <span class="ui-badge" [ngClass]="getBadgeClass(c.estado_cita)">{{ getEstadoNombre(c.estado_cita) }}</span>
      </div>

      <dl class="ui-data">
        <div><dt>Médico:</dt><dd>{{ c.medico_nombre }}</dd></div>
        <div><dt>Especialidad:</dt><dd>{{ c.especialidad }}</dd></div>
        <div><dt>Motivo:</dt><dd>{{ c.motivo }}</dd></div>
      </dl>

      <div class="mc-card__actions">
        <button type="button" class="ui-btn ui-btn--ghost-danger" (click)="eliminarCita(c.idCita)">Eliminar cita</button>
      </div>
    </article>
  </div>
</app-paciente-layout>
