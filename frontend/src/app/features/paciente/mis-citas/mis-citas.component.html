<div class="container mt-5 pt-5">
  <h2 class="mb-4">Mis Citas</h2>

  <div *ngIf="citas.length === 0" class="alert alert-info">
    No tienes citas registradas.
  </div>

  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let c of citas">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-light">
           <h5 class="mb-0">{{ c.fecha_cita }} - {{ c.hora_cita }}</h5>
           <span class="badge" [ngClass]="getBadgeClass(c.estado_cita)">{{ getEstadoNombre(c.estado_cita) }}</span>
        </div>
        <div class="card-body">
            <div>
                <p><strong>Médico:</strong> {{ c.medico_nombre }}</p>
                <p><strong>Especialidad:</strong> {{ c.especialidad }}</p>
                <p><strong>Motivo:</strong> {{ c.motivo }}</p>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <button class="btn btn-danger btn-sm" (click)="eliminarCita(c.idCita)">Eliminar cita</button>
            </div>
        </div>
      </div>
    </div>
  </div>
    <div class="mt-3">
        <a routerLink="/welcome" class="btn btn-secondary">Volver</a>
    </div>
</div>
