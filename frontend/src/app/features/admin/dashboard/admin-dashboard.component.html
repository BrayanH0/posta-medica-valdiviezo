<div class="dashboard-wrapper" [class.collapsed]="collapsed">

    <nav class="nav">
      <a routerLink="inicio" routerLinkActive="active">Inicio</a>
      <a routerLink="pacientes" routerLinkActive="active">Pacientes</a>
      <a routerLink="medicos" routerLinkActive="active">Medicos</a>
      <a routerLink="reportes" routerLinkActive="active">Informes</a>
      <a routerLink="cant-estado-cita" routerLinkActive="active">Gráficos</a>
