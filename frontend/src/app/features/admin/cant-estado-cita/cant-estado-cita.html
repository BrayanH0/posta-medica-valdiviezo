<div class="card">
    <div class="card-header">
        <h3>Citas por Estado</h3>
    </div>
    <div class="card-body">
        <div #pieContainer id="pieEstadoCita" style="width:100%;height:400px;"></div>

        <p *ngIf="datosEstado.length === 0 && !pieChart">
            No hay información disponible para el gráfico de estado.
        </p>
    </div>
</div>

<hr />

<hr />
