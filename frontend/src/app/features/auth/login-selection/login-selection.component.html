<app-auth-layout>
    <h1 class="auth-title">Bienvenido</h1>
    <p class="auth-subtitle">Seleccione su rol para continuar.</p>
    <p *ngIf="aviso" class="aviso-sesion ui-alert ui-alert--warn" role="alert">{{ aviso }}</p>

    <div class="options">
        <button type="button" class="option" (click)="irALoginPaciente()" aria-labelledby="tit-paciente" aria-describedby="desc-paciente">
            <span class="option__text">
                <span class="option__title" id="tit-paciente">Soy Paciente</span>
                <span class="option__desc" id="desc-paciente">Reserve citas y consulte su historial.</span>
            </span>
            <svg class="option__arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button type="button" class="option" (click)="irALoginMedico()" aria-labelledby="tit-medico" aria-describedby="desc-medico">
            <span class="option__text">
                <span class="option__title" id="tit-medico">Soy Médico</span>
                <span class="option__desc" id="desc-medico">Confirme o cancele las citas de sus pacientes.</span>
            </span>
            <svg class="option__arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button type="button" class="option" (click)="irALoginAdmin()" aria-labelledby="tit-admin" aria-describedby="desc-admin">
            <span class="option__text">
                <span class="option__title" id="tit-admin">Soy Administrador</span>
                <span class="option__desc" id="desc-admin">Gestione pacientes, médicos y reportes.</span>
            </span>
            <svg class="option__arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
    </div>
</app-auth-layout>
