<app-auth-layout [mostrarSelectorRol]="true">
    <h1 class="auth-title">Ingreso de pacientes</h1>
    <p class="auth-subtitle">Ingrese su DNI y contraseña para reservar sus citas.</p>

    <form (ngSubmit)="login()">
        <div class="ui-field">
            <label class="ui-label" for="dni">DNI</label>
            <input class="ui-input" type="text" id="dni" [(ngModel)]="dni" name="dni" required placeholder="Ingrese su DNI" maxlength="8" pattern="[0-9]*" inputmode="numeric" (keypress)="$event.charCode >= 48 && $event.charCode <= 57">
        </div>

        <div class="ui-field">
            <label class="ui-label" for="clave">Contraseña</label>
            <div class="ui-password">
                <input class="ui-input" [type]="mostrarClave ? 'text' : 'password'" id="clave" [(ngModel)]="clave" name="clave" required placeholder="Ingrese su contraseña">
                <button type="button" (click)="toggleMostrarClave()" class="ui-password__toggle" [attr.aria-label]="mostrarClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    {{ mostrarClave ? 'Ocultar' : 'Mostrar' }}
                </button>
            </div>
        </div>

        <div *ngIf="error" class="error-message ui-alert ui-alert--danger" role="alert">
            {{ error }}
        </div>

        <button type="submit" class="ui-btn ui-btn--primary">Iniciar Sesión</button>
    </form>

    <p class="auth-footer">
        ¿Aún no tiene cuenta? <a class="ui-link" routerLink="/registro">Registrarse</a>
    </p>
</app-auth-layout>
