<app-auth-layout ancho="ancho">
    <h1 class="auth-title">Registro de paciente</h1>
    <p class="auth-subtitle">Cree su cuenta para reservar citas. Los campos con asterisco son obligatorios.</p>

    <form (ngSubmit)="registrar()">
        <div class="form-grid">
            <div class="ui-field">
                <label class="ui-label" for="nombres">Nombres *</label>
                <input class="ui-input" type="text" id="nombres" [(ngModel)]="paciente.nombres" name="nombres" required placeholder="Pedro Luis">
            </div>

            <div class="ui-field">
                <label class="ui-label" for="apellidos">Apellidos *</label>
                <input class="ui-input" type="text" id="apellidos" [(ngModel)]="paciente.apellidos" name="apellidos" required placeholder="Sanchez Dominguez">
            </div>

            <div class="ui-field">
                <label class="ui-label" for="dni">DNI *</label>
                <input class="ui-input" type="text" id="dni" [(ngModel)]="paciente.dni" name="dni" required maxlength="8" placeholder="74308060" pattern="[0-9]*" inputmode="numeric" (keypress)="$event.charCode >= 48 && $event.charCode <= 57">
            </div>

            <div class="ui-field">
                <label class="ui-label" for="fecha_nacimiento">Fecha de nacimiento *</label>
                <input class="ui-input" type="date" id="fecha_nacimiento" [(ngModel)]="paciente.fecha_nacimiento" name="fecha_nacimiento" required [min]="minFechaNacimiento" [max]="maxFechaNacimiento">
            </div>

            <div class="ui-field">
                <label class="ui-label" for="sexo">Sexo *</label>
                <select class="ui-input" id="sexo" [(ngModel)]="paciente.sexo" name="sexo" required>
                    <option value="">Seleccione...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </div>

            <div class="ui-field">
                <label class="ui-label" for="telefono">Teléfono (opcional)</label>
                <input class="ui-input" type="tel" id="telefono" [(ngModel)]="paciente.telefono" name="telefono" placeholder="999 888 777">
            </div>
        </div>

        <div class="ui-field">
            <label class="ui-label" for="clave">Contraseña *</label>
            <input class="ui-input" type="password" id="clave" [(ngModel)]="paciente.clave" name="clave" required placeholder="Ingrese su contraseña" aria-describedby="clave-ayuda">
            <p class="ui-hint" id="clave-ayuda">Mínimo 6 caracteres, con una mayúscula, una minúscula, un número y un símbolo.</p>
        </div>

        <!-- El aviso va junto al botón que se acaba de pulsar: arriba del formulario quedaba fuera de pantalla en celular -->
        <button type="submit" class="ui-btn ui-btn--primary">Registrar</button>

        <!-- El aviso va justo debajo del botón que se acaba de pulsar (arriba del formulario quedaba fuera de pantalla en celular).
             Su espacio está reservado: el formulario mide lo mismo con y sin error, así no se mueve -->
        <div class="registro-aviso">
            <div *ngIf="error" class="error-message ui-alert ui-alert--danger" role="alert">
                {{ error }}
            </div>
        </div>
    </form>

    <p class="auth-footer">
        ¿Ya tiene cuenta? <a class="ui-link" routerLink="/login-paciente">Volver al ingreso</a>
    </p>
</app-auth-layout>
