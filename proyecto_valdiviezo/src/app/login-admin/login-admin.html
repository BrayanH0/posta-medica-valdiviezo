<div class="container mt-5" style="max-width: 400px;">
  <div class="card p-4">
    <h2 class="text-center mb-4">Login Administrador</h2>
    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label">DNI / Usuario</label>
        <input type="text" class="form-control" [(ngModel)]="dni" name="dni" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="clave" name="clave" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Iniciar Sesión</button>
    </form>
  </div>
</div>
