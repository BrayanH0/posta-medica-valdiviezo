<div class="login-container">
    <div class="login-box">
        <h2>Iniciar Sesión - Paciente</h2>
        <form (ngSubmit)="login()">
            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" [(ngModel)]="dni" name="dni" required placeholder="Ingrese su DNI" maxlength="8" pattern="[0-9]*" (keypress)="$event.charCode >= 48 && $event.charCode <= 57">
            </div>
            
            <div class="form-group">
                <label for="clave">Contraseña:</label>
                <div class="password-input">
                    <input [type]="mostrarClave ? 'text' : 'password'" id="clave" [(ngModel)]="clave" name="clave" required placeholder="Ingrese su contraseña">
                    <button type="button" (click)="toggleMostrarClave()" class="toggle-btn" title="Mostrar/Ocultar contraseña">
                        {{ mostrarClave ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
            </div>

            <div *ngIf="error" class="error-message">
                {{ error }}
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
        
        <div class="actions">
            <button type="button" class="btn-secondary" routerLink="/registro">Registrarse</button>
            <button type="button" class="btn-secondary" routerLink="/login-selection">Volver</button>
        </div>
    </div>
</div>
