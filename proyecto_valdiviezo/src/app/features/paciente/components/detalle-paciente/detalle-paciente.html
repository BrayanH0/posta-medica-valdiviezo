<link rel="stylesheet" href="detalle-paciente.css">

<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-11">
                <div class="card-title" *ngIf="id===0">Nuevo Paciente</div>
                <div class="card-title" *ngIf="id!=0"> Paciente {{id}}</div>
            </div>
            <div class="col-1">
                <button class="btn-close" (click)="cerrar()"></button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="row">
            <label for="txt_nombres">Nombre</label>
            <input type="text" class="form-control" id="txt_nombres">
        </div>
        <div class="row">
            <label for="txt_apellidos">Apellidos</label>
            <input type="text" class="form-control" id="txt_apellidos">
        </div>
        <div class="row">
            <label for="txt_dni">DNI</label>
            <input type="text" class="form-control" id="txt_dni">
        </div>
        <div class="row">
            <label for="txt_fecha_nacimiento">Fecha de Nacimiento</label>
            <input type="text" class="form-control" id="txt_fecha_nacimiento">
        </div>
        <div class="row">
            <label for="txt_sexo">Sexo</label>
            <input type="text" class="form-control" id="txt_sexo">
        </div>
        <div class="row">
            <label for="txt_id_estado_paciente">ID Estado Paciente</label>
            <input type="text" class="form-control" id="txt_id_estado_paciente">
        </div>
        <div class="row">
            <label for="txt_ubigeo">ID Ubigeo</label>
            <input type="text" class="form-control" id="txt_ubigeo">
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-secondary" (click)="cerrar()">Cancelar</button>
        &nbsp;
        <button class="btn btn-primary" (click)="guardar()">Grabar</button>
    </div>
</div>
