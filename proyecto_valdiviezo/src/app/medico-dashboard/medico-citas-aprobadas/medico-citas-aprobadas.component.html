<div class="citas-container">
    <h2>Gestión de Citas Confirmadas</h2>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <div class="table-container" *ngIf="citas">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Paciente</th>
                    <th>DNI</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let cita of citas">
                    <td>{{ cita.idCita }}</td>
                    <td>{{ cita.pacienteNombres }} {{ cita.pacienteApellidos }}</td>
                    <td>{{ cita.pacienteDni }}</td>
                    <td>{{ cita.fecha }}</td>
                    <td>{{ cita.hora }}</td>
                    <td>{{ cita.motivo }}</td>
                    <td><span class="badge badge-success">{{ cita.estado }}</span></td>
                </tr>
                <tr *ngIf="citas.length === 0">
                    <td colspan="7" class="empty-message">No hay citas confirmadas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
